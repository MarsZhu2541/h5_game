# 图片 id 对应的内容不会变。缓存目录需在镜像里预先建好。
proxy_cache_path /var/cache/nginx/ai_images levels=1:2 keys_zone=ai_images:10m max_size=2g inactive=30d use_temp_path=off;

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;


    error_page 497 https://$http_host$request_uri;
    listen       443 ssl;
    server_name  139.196.93.191;
    ssl_certificate      /ssl/139.196.93.191_certificate.pem;
    ssl_certificate_key  /ssl/139.196.93.191_private.key;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers  on;
        ssl_protocols TLSv1.2 TLSv1.3;

    # 云顶 Vite SPA：无物理文件时回退到 index.html
    location /yunding/ {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /yunding/index.html;
    }

    location = /yunding {
        return 301 /yunding/;
    }


    # DeepSeek Harness：宿主机 3080。容器内 127.0.0.1 到不了宿主机，走 Docker 网桥。
    # 监听器只认根路径，所以去掉 /deepseek-harness 再转发；Cookie 的 Path 改回这个前缀。
    location = /deepseek-harness {
        return 301 /deepseek-harness/;
    }

    location /deepseek-harness/ {
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /deepseek-harness/;
        proxy_redirect / /deepseek-harness/;
        proxy_redirect http://139.196.93.191/ http://139.196.93.191/deepseek-harness/;
        client_max_body_size 32M;

        rewrite ^/deepseek-harness/(.*)$ /$1 break;
        proxy_pass http://172.17.0.1:3080;
    }

    # 登录插件的 302 指向站点根 /auth/login，不在 /deepseek-harness 下
    location /auth/ {
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /deepseek-harness/;
        proxy_redirect http://139.196.93.191/ http://139.196.93.191/deepseek-harness/;
        client_max_body_size 32M;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter '"redirect":"/"' '"redirect":"/deepseek-harness/"';

        proxy_pass http://172.17.0.1:3080;
    }

    # Harness 占用站点根上的 /api。聊天后端改走 /aiapi，避免和这里抢路径。
    # 认证插件会按浏览器 Host 连回 /api/remote.mux，所以必须匹配整个 /api 前缀。
    location /api {
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://172.17.0.1:3080;
    }

    # 聊天图片单独缓存：浏览器一年内直接用本地副本，Nginx 也留下字节，不再每次打到后端。
    location /aiapi/images/ {
        proxy_cache ai_images;
        proxy_cache_lock on;
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable";

        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://139.196.93.191:8000;
    }

    # 聊天页 fetch /ai?msg= ，开发时由 Vite 代理，镜像里交给这里。
    # 单张图上限 16MB，base64 后约 22MB，再算上历史里的图片。
    location /aiapi {
        client_max_body_size 64M;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://139.196.93.191:8000;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        if ($request_uri ~* .*[.](js|css|map|jpg|png|svg|ico)$) {
              add_header Cache-Control "public, max-age=2592000";#非html缓存1个月
            }

            if ($request_filename ~* ^.*[.](html|htm)$) {
              add_header Cache-Control "public, no-cache";
              #html文件协商缓存，也就是每次都询问服务器，浏览器本地是是否是最新的，是最新的就直接用，非最新的服务器就会返回最新
            }

    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}

    location /.well-known/acme-challenge/ {
         proxy_pass http://letsssl.cn:8000/api/api/ssl/httpChallengeV2/Zvl8CJgvZ8d7dc6psbZeMQ==/;
    }
}